<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarbonTraceAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">🌍 CarbonTrace<span>AI</span></a>
    <a href="index.html">Home</a>
</nav>

<main class="auth-container">

    <section class="auth-card" id="loginPanel">
        <div class="eyebrow">WELCOME BACK</div>
        <h1>Sign In</h1>
        <p>Access your CarbonTraceAI workspace.</p>

        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit" class="btn btn-full">Login →</button>
        </form>

        <p class="auth-switch">
            New supplier?
            <a href="#" id="showRegister">Create Account</a>
        </p>
    </section>

    <section class="auth-card hidden" id="registerPanel">
        <div class="eyebrow">JOIN OUR NETWORK</div>
        <h1>Create Account</h1>
        <p>Register your supplier company.</p>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Your name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Your email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Minimum 8 characters" minlength="8" required>

            <label>Company Name</label>
            <input type="text" name="companyName" placeholder="Company name" required>

            <label>Industry</label>
            <select name="industry" required>
                <option value="">Select industry</option>
                <option value="Manufacturing">Manufacturing</option>
                <option value="Transportation">Transportation</option>
                <option value="Agriculture">Agriculture</option>
                <option value="Energy">Energy</option>
                <option value="Packaging">Packaging</option>
                <option value="Other">Other</option>
            </select>

            <label>Country</label>
            <input type="text" name="country" value="India" required>

            <button type="submit" class="btn btn-full">Register Now →</button>
        </form>

        <p class="auth-switch">
            Already registered?
            <a href="#" id="showLogin">Login</a>
        </p>
    </section>

    <p id="authMessage" class="message"></p>

</main>

<script src="js/auth.js"></script>
</body>
</html>
